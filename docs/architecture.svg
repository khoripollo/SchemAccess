<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000"
     font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1400" height="1000" fill="#ffffff"/>

  <!-- Title -->
  <text x="700" y="44" text-anchor="middle" font-size="25" font-weight="600"
        fill="#111827">SchemAccess - how the modules fit together</text>
  <text x="700" y="70" text-anchor="middle" font-size="14" fill="#6b7280">
    One KiCad schematic goes in; a spoken description and a redrawn circuit come out
  </text>

  <!-- ============================================================
       LEFT RAIL - the shared data model
       ============================================================ -->
  <rect x="30" y="188" width="270" height="784" rx="10" fill="#f8fafc"
        stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="165" y="218" text-anchor="middle" font-size="16" font-weight="600"
        fill="#334155">model.py</text>
  <text x="165" y="237" text-anchor="middle" font-size="11" fill="#64748b"
        font-style="italic">the shared vocabulary</text>

  <text x="48" y="266" font-size="11.5" fill="#475569">Defines the classes that every</text>
  <text x="48" y="283" font-size="11.5" fill="#475569">other module passes around, so</text>
  <text x="48" y="300" font-size="11.5" fill="#475569">they all describe a circuit the</text>
  <text x="48" y="317" font-size="11.5" fill="#475569">same way. No logic of its own.</text>

  <line x1="48" y1="338" x2="282" y2="338" stroke="#e2e8f0"/>

  <text x="48" y="364" font-size="12.5" font-weight="600" fill="#1e293b">Document layer</text>
  <text x="48" y="382" font-size="11" fill="#64748b" font-style="italic">
    what the file literally says</text>
  <text x="48" y="406" font-size="11.5" fill="#475569">SchematicDocument</text>
  <text x="48" y="424" font-size="11.5" fill="#475569">SymbolInstance, LibSymbol</text>
  <text x="48" y="442" font-size="11.5" fill="#475569">Wire, Junction, Label</text>
  <text x="48" y="466" font-size="11" fill="#94a3b8">Keeps KiCad's exact positions</text>
  <text x="48" y="482" font-size="11" fill="#94a3b8">so the redraw can match it.</text>

  <line x1="48" y1="504" x2="282" y2="504" stroke="#e2e8f0"/>

  <text x="48" y="530" font-size="12.5" font-weight="600" fill="#1e293b">Circuit layer</text>
  <text x="48" y="548" font-size="11" fill="#64748b" font-style="italic">
    what it means electrically</text>
  <text x="48" y="572" font-size="11.5" fill="#475569">CircuitGraph</text>
  <text x="48" y="590" font-size="11.5" fill="#475569">Component, PinConnection</text>
  <text x="48" y="608" font-size="11.5" fill="#475569">Net</text>
  <text x="48" y="632" font-size="11" fill="#94a3b8">Which parts exist and which</text>
  <text x="48" y="648" font-size="11" fill="#94a3b8">nodes their pins sit on.</text>

  <line x1="48" y1="670" x2="282" y2="670" stroke="#e2e8f0"/>

  <text x="48" y="696" font-size="12.5" font-weight="600" fill="#1e293b">Two tricky details</text>
  <text x="48" y="720" font-size="11.5" fill="#475569">snap()</text>
  <text x="48" y="737" font-size="11" fill="#94a3b8">Rounds every coordinate before</text>
  <text x="48" y="753" font-size="11" fill="#94a3b8">comparing it, so tiny rounding</text>
  <text x="48" y="769" font-size="11" fill="#94a3b8">errors can't split a wire in two.</text>

  <text x="48" y="797" font-size="11.5" fill="#475569">lib_point()</text>
  <text x="48" y="814" font-size="11" fill="#94a3b8">A symbol's pins are stored</text>
  <text x="48" y="830" font-size="11" fill="#94a3b8">relative to the symbol. This</text>
  <text x="48" y="846" font-size="11" fill="#94a3b8">rotates, flips and moves them</text>
  <text x="48" y="862" font-size="11" fill="#94a3b8">to where they land on the page.</text>

  <text x="48" y="890" font-size="11.5" fill="#475569">classify()</text>
  <text x="48" y="907" font-size="11" fill="#94a3b8">Decides what a part actually is</text>
  <text x="48" y="923" font-size="11" fill="#94a3b8">- resistor, NPN, op-amp - from</text>
  <text x="48" y="939" font-size="11" fill="#94a3b8">its pins, name and reference.</text>

  <!-- ============================================================
       RIGHT RAIL - front ends
       ============================================================ -->
  <rect x="1100" y="188" width="270" height="784" rx="10" fill="#f8fafc"
        stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="1235" y="218" text-anchor="middle" font-size="16" font-weight="600"
        fill="#334155">How you run it</text>
  <text x="1235" y="237" text-anchor="middle" font-size="11" fill="#64748b"
        font-style="italic">these drive everything else</text>

  <line x1="1118" y1="256" x2="1352" y2="256" stroke="#e2e8f0"/>

  <text x="1118" y="282" font-size="12.5" font-weight="600" fill="#1e293b">pipeline.py</text>
  <text x="1118" y="303" font-size="11.5" fill="#475569">Runs the stages below in</text>
  <text x="1118" y="320" font-size="11.5" fill="#475569">order, counts how many</text>
  <text x="1118" y="337" font-size="11.5" fill="#475569">parts converted, and times</text>
  <text x="1118" y="354" font-size="11.5" fill="#475569">each step in milliseconds.</text>

  <line x1="1118" y1="376" x2="1352" y2="376" stroke="#e2e8f0"/>

  <text x="1118" y="402" font-size="12.5" font-weight="600" fill="#1e293b">cli.py</text>
  <text x="1118" y="423" font-size="11.5" fill="#475569">The command-line version.</text>
  <text x="1118" y="440" font-size="11.5" fill="#475569">One command converts a</text>
  <text x="1118" y="457" font-size="11.5" fill="#475569">file. --check reports what</text>
  <text x="1118" y="474" font-size="11.5" fill="#475569">would happen and writes</text>
  <text x="1118" y="491" font-size="11.5" fill="#475569">nothing to disk.</text>

  <line x1="1118" y1="513" x2="1352" y2="513" stroke="#e2e8f0"/>

  <text x="1118" y="539" font-size="12.5" font-weight="600" fill="#1e293b">gui/main_window.py</text>
  <text x="1118" y="560" font-size="11.5" fill="#475569">The desktop window. Drag a</text>
  <text x="1118" y="577" font-size="11.5" fill="#475569">schematic in, tick which</text>
  <text x="1118" y="594" font-size="11.5" fill="#475569">outputs you want, press</text>
  <text x="1118" y="611" font-size="11.5" fill="#475569">Generate. The work runs on</text>
  <text x="1118" y="628" font-size="11.5" fill="#475569">a background thread so the</text>
  <text x="1118" y="645" font-size="11.5" fill="#475569">window never freezes.</text>

  <line x1="1118" y1="667" x2="1352" y2="667" stroke="#e2e8f0"/>

  <text x="1118" y="693" font-size="12.5" font-weight="600" fill="#1e293b">tests/</text>
  <text x="1118" y="714" font-size="11.5" fill="#475569">330 automated tests.</text>
  <text x="1118" y="738" font-size="11.5" fill="#475569">The audit test counts the</text>
  <text x="1118" y="755" font-size="11.5" fill="#475569">components, nodes and</text>
  <text x="1118" y="772" font-size="11.5" fill="#475569">connections in all three</text>
  <text x="1118" y="789" font-size="11.5" fill="#475569">files - the schematic, the</text>
  <text x="1118" y="806" font-size="11.5" fill="#475569">drawing and the written</text>
  <text x="1118" y="823" font-size="11.5" fill="#475569">description - and fails if</text>
  <text x="1118" y="840" font-size="11.5" fill="#475569">the three disagree.</text>
  <text x="1118" y="864" font-size="11" fill="#94a3b8">That is how we know nothing</text>
  <text x="1118" y="880" font-size="11" fill="#94a3b8">went missing in between.</text>

  <!-- ============================================================
       INPUT
       ============================================================ -->
  <rect x="550" y="92" width="300" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="700" y="117" text-anchor="middle" font-size="16" font-weight="600"
        fill="#111827">your .kicad_sch file</text>
  <text x="700" y="136" text-anchor="middle" font-size="11.5" fill="#6b7280">
    saved straight out of KiCad</text>

  <line x1="700" y1="148" x2="700" y2="182" stroke="#6b7280" stroke-width="1.6"
        marker-end="url(#arrow)"/>

  <!-- ============================================================
       PARSING
       ============================================================ -->
  <rect x="320" y="188" width="760" height="168" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="340" y="210" font-size="12" font-weight="700" fill="#1d4ed8"
        letter-spacing="1.2">PARSING</text>

  <rect x="340" y="222" width="355" height="122" rx="6" fill="#ffffff" stroke="#60a5fa"/>
  <text x="517" y="246" text-anchor="middle" font-size="15" font-weight="600"
        fill="#1e3a8a">sexpr.py</text>
  <text x="517" y="263" text-anchor="middle" font-size="10.5" fill="#64748b"
        font-style="italic">reads the raw text</text>
  <text x="356" y="285" font-size="11.5" fill="#475569">A KiCad file is just text made of nested</text>
  <text x="356" y="302" font-size="11.5" fill="#475569">brackets. This reads it and hands back</text>
  <text x="356" y="319" font-size="11.5" fill="#475569">nested Python lists the code can step</text>
  <text x="356" y="336" font-size="11.5" fill="#475569">through, one item at a time.</text>

  <line x1="697" y1="283" x2="723" y2="283" stroke="#6b7280" stroke-width="1.6"
        marker-end="url(#arrow)"/>

  <rect x="725" y="222" width="355" height="122" rx="6" fill="#ffffff" stroke="#60a5fa"/>
  <text x="902" y="246" text-anchor="middle" font-size="15" font-weight="600"
        fill="#1e3a8a">kicad_parser.py</text>
  <text x="902" y="263" text-anchor="middle" font-size="10.5" fill="#64748b"
        font-style="italic">works out what the lists mean</text>
  <text x="741" y="285" font-size="11.5" fill="#475569">Picks out what matters: every symbol</text>
  <text x="741" y="302" font-size="11.5" fill="#475569">with its position, rotation and pins, plus</text>
  <text x="741" y="319" font-size="11.5" fill="#475569">each wire, junction and label. Anything</text>
  <text x="741" y="336" font-size="11.5" fill="#475569">it can't read becomes a warning.</text>

  <line x1="700" y1="356" x2="700" y2="424" stroke="#6b7280" stroke-width="1.6"
        marker-end="url(#arrow)"/>
  <rect x="440" y="375" width="520" height="30" rx="15" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="700" y="395" text-anchor="middle" font-size="12" fill="#5b21b6">
    SchematicDocument - every shape, exactly where KiCad put it</text>

  <!-- ============================================================
       NETBUILDER
       ============================================================ -->
  <rect x="390" y="428" width="620" height="136" rx="10" fill="#faf5ff" stroke="#c084fc"/>
  <text x="700" y="454" text-anchor="middle" font-size="16" font-weight="600"
        fill="#6b21a8">netbuilder.py</text>
  <text x="700" y="471" text-anchor="middle" font-size="10.5" fill="#7e22ce"
        font-style="italic">turns shapes into an actual circuit</text>
  <text x="408" y="493" font-size="12" fill="#475569">
    So far we only have shapes at coordinates. This works out what is really connected:</text>
  <text x="408" y="511" font-size="12" fill="#475569">
    it groups every pin, wire and junction that touch into nets - the circuit's nodes. It</text>
  <text x="408" y="529" font-size="12" fill="#475569">
    follows KiCad's rules, so a wire ending on another wire joins it, but two wires that</text>
  <text x="408" y="547" font-size="12" fill="#475569">
    merely cross do not.</text>

  <line x1="700" y1="564" x2="700" y2="626" stroke="#6b7280" stroke-width="1.6"/>
  <rect x="440" y="577" width="520" height="30" rx="15" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="700" y="597" text-anchor="middle" font-size="12" fill="#5b21b6">
    CircuitGraph - the parts, and which node each pin sits on</text>

  <!-- split -->
  <line x1="502" y1="626" x2="898" y2="626" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="502" y1="626" x2="502" y2="660" stroke="#6b7280" stroke-width="1.6"
        marker-end="url(#arrow)"/>
  <line x1="898" y1="626" x2="898" y2="660" stroke="#6b7280" stroke-width="1.6"
        marker-end="url(#arrow)"/>
  <text x="700" y="648" text-anchor="middle" font-size="11" fill="#7e22ce"
        font-style="italic">both outputs are built from this one graph</text>

  <!-- ============================================================
       TRANSLATION
       ============================================================ -->
  <rect x="320" y="664" width="365" height="248" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="340" y="686" font-size="12" font-weight="700" fill="#047857"
        letter-spacing="1.2">TRANSLATION</text>

  <rect x="338" y="698" width="329" height="124" rx="6" fill="#ffffff" stroke="#34d399"/>
  <text x="502" y="722" text-anchor="middle" font-size="15" font-weight="600"
        fill="#065f46">circuitikz.py</text>
  <text x="502" y="739" text-anchor="middle" font-size="10.5" fill="#64748b"
        font-style="italic">redraws the circuit in LaTeX</text>
  <text x="354" y="761" font-size="11.5" fill="#475569">Chooses the matching CircuiTikZ</text>
  <text x="354" y="778" font-size="11.5" fill="#475569">symbol for each part and puts it at</text>
  <text x="354" y="795" font-size="11.5" fill="#475569">its original coordinates, so the</text>
  <text x="354" y="812" font-size="11.5" fill="#475569">result looks like your KiCad sheet.</text>

  <line x1="502" y1="822" x2="502" y2="832" stroke="#6b7280" stroke-width="1.6"
        marker-end="url(#arrow)"/>

  <rect x="338" y="834" width="329" height="66" rx="6" fill="#ffffff" stroke="#34d399"/>
  <text x="502" y="856" text-anchor="middle" font-size="15" font-weight="600"
        fill="#065f46">renderer.py</text>
  <text x="354" y="877" font-size="11.5" fill="#475569">Runs LaTeX on that file to make a</text>
  <text x="354" y="894" font-size="11.5" fill="#475569">PDF, then converts it to SVG and PNG.</text>

  <line x1="502" y1="912" x2="502" y2="934" stroke="#6b7280" stroke-width="1.6"
        marker-end="url(#arrow)"/>
  <rect x="338" y="938" width="329" height="50" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="502" y="959" text-anchor="middle" font-size="13" font-weight="600"
        fill="#111827">.tex   .pdf   .svg   .png</text>
  <text x="502" y="977" text-anchor="middle" font-size="11" fill="#6b7280">
    a clean redraw of the same layout</text>

  <!-- ============================================================
       ACCESSIBILITY
       ============================================================ -->
  <rect x="715" y="664" width="365" height="248" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="735" y="686" font-size="12" font-weight="700" fill="#c2410c"
        letter-spacing="1.2">ACCESSIBILITY</text>

  <rect x="733" y="698" width="329" height="124" rx="6" fill="#ffffff" stroke="#fb923c"/>
  <text x="897" y="722" text-anchor="middle" font-size="15" font-weight="600"
        fill="#9a3412">analyzer.py</text>
  <text x="897" y="739" text-anchor="middle" font-size="10.5" fill="#64748b"
        font-style="italic">recognises circuit patterns</text>
  <text x="749" y="761" font-size="11.5" fill="#475569">Spots which parts sit in series or in</text>
  <text x="749" y="778" font-size="11.5" fill="#475569">parallel, and which ones together</text>
  <text x="749" y="795" font-size="11.5" fill="#475569">form a voltage divider, RC filter,</text>
  <text x="749" y="812" font-size="11.5" fill="#475569">Wheatstone bridge or op-amp stage.</text>

  <line x1="897" y1="822" x2="897" y2="832" stroke="#6b7280" stroke-width="1.6"
        marker-end="url(#arrow)"/>

  <rect x="733" y="834" width="329" height="66" rx="6" fill="#ffffff" stroke="#fb923c"/>
  <text x="897" y="856" text-anchor="middle" font-size="15" font-weight="600"
        fill="#9a3412">alttext.py</text>
  <text x="749" y="877" font-size="11.5" fill="#475569">Writes it in an order a listener can</text>
  <text x="749" y="894" font-size="11.5" fill="#475569">follow: overview, patterns, then pins.</text>

  <line x1="897" y1="912" x2="897" y2="934" stroke="#6b7280" stroke-width="1.6"
        marker-end="url(#arrow)"/>
  <rect x="733" y="938" width="329" height="50" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="897" y="959" text-anchor="middle" font-size="13" font-weight="600"
        fill="#111827">_alt_text.txt</text>
  <text x="897" y="977" text-anchor="middle" font-size="11" fill="#6b7280">
    what a screen reader speaks aloud</text>
</svg>
