[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schemaccess"
version = "1.0.0"
description = "Accessible schematics: convert KiCad .kicad_sch files to screen-reader alt text and CircuiTikZ/LaTeX renderings (PDF/SVG/PNG)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SchemAccess contributors" }]
keywords = ["kicad", "accessibility", "circuitikz", "latex", "schematic", "alt-text"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=7.0"]

[project.scripts]
schemaccess = "schemaccess.cli:main"

[project.gui-scripts]
schemaccess-gui = "schemaccess.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
